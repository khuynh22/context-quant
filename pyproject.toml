[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

# ── Project metadata ──────────────────────────────────────────────────────────
[project]
name = "context-quant"
version = "0.1.0"
description = "Multi-modal late-fusion deep learning system for stock guidance."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"

dependencies = [
    # Scientific stack
    "numpy>=1.26",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "scikit-learn>=1.4",
    "scipy>=1.11",

    # PyTorch (CPU build — uv pulls from pytorch-cpu index defined below)
    "torch==2.10.0+cpu",
    "torchvision==0.25.0+cpu",
    "torchaudio==2.10.0+cpu",

    # Hugging Face
    "transformers>=4.40",
    "datasets>=2.18",
    "tokenizers>=0.19",
    "huggingface-hub>=0.22",
    "safetensors>=0.4",

    # Finance data & technical analysis
    "yfinance>=0.2",
    "ta>=0.11",

    # Visualisation
    "seaborn>=0.13",
    "plotly>=5.20",

    # Dashboard
    "streamlit>=1.30",

    # Utilities
    "python-dotenv>=1.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
jupyter = [
    "jupyterlab>=4.1",
    "ipywidgets>=8.1",
    "ipykernel>=6.29",
]
dev = [
    "flake8>=7.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

# ── uv ───────────────────────────────────────────────────────────────────────
# Tell uv where to fetch the CPU-only PyTorch wheels from.
# `explicit = true` means uv ONLY uses this index for the listed packages,
# so it won't accidentally pull a CUDA build from PyPI.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch       = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
torchaudio  = { index = "pytorch-cpu" }

# ── Package discovery ────────────────────────────────────────────────────────
[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

# ── Pytest ───────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -q"
