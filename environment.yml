name: context-quant
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip

  # Core scientific stack
  - numpy
  - pandas
  - matplotlib
  - scikit-learn

  # PyTorch (CPU build — upgrade to CUDA version when you have a GPU)
  # CPU:
  - pytorch::pytorch
  - pytorch::torchvision
  - pytorch::torchaudio
  - pytorch::cpuonly

  # Jupyter
  - jupyterlab
  - ipywidgets
  - ipykernel

  - pip:
      # Hugging Face ecosystem
      - transformers
      - datasets
      - tokenizers

      # Finance data
      - yfinance
      - ta                  # technical analysis (RSI, MACD, BB, etc.) — replaces pandas-ta

      # Visualization
      - seaborn
      - plotly

      # Dashboard
      - streamlit

      # Utilities
      - python-dotenv
      - tqdm
